<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Shoes Product Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls input, .controls button, .controls select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .controls input {
            flex: 1;
            min-width: 200px;
            border: 2px solid #ddd;
        }

        .controls input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .controls button {
            background: #667eea;
            color: white;
            border: none;
            font-weight: bold;
        }

        .controls button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .controls button.danger {
            background: #e74c3c;
        }

        .controls button.danger:hover {
            background: #c0392b;
        }

        .stats {
            background: white;
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .product-card.selected {
            border: 3px solid #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-num {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .footer {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            position: fixed;
            bottom: 20px;
            right: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .footer button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .footer button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .footer button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .selected-count {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            margin-right: 10px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .footer {
                position: static;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Dance Shoes Product Browser</h1>
            <p>Select products you're interested in and generate your selection list</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search product number...">
            <select id="sortSelect">
                <option value="number">Sort by Product #</option>
            </select>
            <button onclick="clearAll()">Clear Selection</button>
            <button class="danger" onclick="selectAll()">Select All</button>
        </div>

        <div class="stats">
            <span id="statsText">Loading...</span>
        </div>

        <div class="gallery" id="gallery"></div>

        <div class="footer">
            <span class="selected-count" id="selectedCount">Selected: 0</span>
            <button onclick="generateList()" id="generateBtn">Generate List 📋</button>
            <button onclick="exportJSON()" id="exportBtn">Export as JSON 📥</button>
        </div>
    </div>

7f8e\u5916\u8d38\u65b0\u6b3e\u767d\u8272\u5973\u5f0f\u6210\u4eba\u65f6\u5c1asalsa\u821e\u62c9\u4e01\u6070\u6070\u4f26\u5df4Bach_IMG.jpg"]}, "419": {"images": ["Product_419_\u7476\u6c60\u70ed\u9500\u6b3e\u9ad8\u90a6\u7cfb\u5e26\u5973\u5f0f\u6210\u4eba\u9c7c\u5634\u9ad8\u5e2e\u7cfb\u5e26salsa\u62c9\u4e01\u6070\u6070\u73b0\u4ee3_IMG.jpg"]}, "420": {"images": ["Product_420_\u6b27\u7f8e\u70ed\u9500\u5973\u5f0f\u6210\u4eba\u9c7c\u5634\u7f51\u773c\u9542\u7a7asalsa\u62c9\u4e01\u6070\u6070\u73b0\u4ee3\u7235\u58eb\u821eBa_IMG.jpg"]}};
        let selectedProducts = [];

        function initGallery() {
            renderGallery(Object.keys(products).map(k => parseInt(k)).sort((a, b) => a - b));
            updateStats();
        }

        function renderGallery(productNums) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            productNums.forEach(num => {
                const product = products[num];
                if (!product || product.images.length === 0) return;

                const card = document.createElement('div');
                card.className = 'product-card';
                const isSelected = selectedProducts.includes(num);
                if (isSelected) card.classList.add('selected');

                const imagePath = '../processed_images/' + product.images[0];
                card.innerHTML = `
                    <img src="${imagePath}" alt="Product #${num}" class="product-image" onerror="this.style.display='none'">
                    <div class="product-info">
                        <div class="product-num">Product #${num}</div>
                        <input type="checkbox" class="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleProduct(${num}, this.checked)">
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function toggleProduct(num, checked) {
            if (checked) {
                if (!selectedProducts.includes(num)) {
                    selectedProducts.push(num);
                }
            } else {
                selectedProducts = selectedProducts.filter(p => p !== num);
            }
            updateStats();
            renderGallery(Object.keys(products).map(k => parseInt(k)).sort((a, b) => a - b));
        }

        function selectAll() {
            selectedProducts = Object.keys(products).map(k => parseInt(k));
            updateStats();
            renderGallery(Object.keys(products).map(k => parseInt(k)).sort((a, b) => a - b));
        }

        function clearAll() {
            selectedProducts = [];
            updateStats();
            renderGallery(Object.keys(products).map(k => parseInt(k)).sort((a, b) => a - b));
        }

        function updateStats() {
            const total = Object.keys(products).length;
            const statsText = document.getElementById('statsText');
            statsText.textContent = `Total Products: ${total} | Selected: ${selectedProducts.length} | Not Selected: ${total - selectedProducts.length}`;

            const selectedCount = document.getElementById('selectedCount');
            selectedCount.textContent = `Selected: ${selectedProducts.length}`;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = Object.keys(products)
                .map(k => parseInt(k))
                .filter(num => {
                    return num.toString().includes(searchTerm);
                })
                .sort((a, b) => a - b);
            renderGallery(filtered);
        });

        function generateList() {
            const list = selectedProducts.sort((a, b) => a - b).join(', ');

            const output = `\n=== My Dance Shoes Selection ===\n\n` +
                          `Total: ${selectedProducts.length} items\n\n` +
                          `Product Numbers: ${list}` +
                          `\n\nGenerated: ${new Date().toLocaleString()}`;

            alert(output);

            navigator.clipboard.writeText(output);
            alert('Copied to clipboard!');
        }

        function exportJSON() {
            const exportData = {
                timestamp: new Date().toISOString(),
                selectedCount: selectedProducts.length,
                selectedProducts: selectedProducts.sort((a, b) => a - b)
            };

            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `shoe-selections-${new Date().getTime()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        initGallery();
    </script>
