            margin-bottom: 20px;

        let currentCategory = 'all';
        let currentSearch = '';
        
        function getCategoryName(cat) {
            const names = {'lead': 'Lead Shoes', 'heels': 'Heels & Follow Shoes', 'sneakers': 'Dance Sneakers'};
            return names[cat] || cat;
        }
        
        function getFilteredProducts() {
            let filtered = products;
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            
            if (currentSearch) {
                filtered = filtered.filter(p => p.number.includes(currentSearch));
            }
            
            return filtered;
        }
        
        function renderGallery() {
            const filtered = getFilteredProducts();
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            
            // Group by category
            const byCategory = {'lead': [], 'heels': [], 'sneakers': []};
            filtered.forEach(p => {
                if (byCategory[p.category]) {
                    byCategory[p.category].push(p);
                }
            });
            
            const categoriesToShow = currentCategory === 'all' 
                ? Object.keys(byCategory).filter(cat => byCategory[cat].length > 0)
                : [currentCategory];
            
            categoriesToShow.forEach(category => {
                const categoryProducts = byCategory[category];
                if (categoryProducts.length === 0) return;
                
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.textContent = getCategoryName(category) + ` (${categoryProducts.length})`;
                container.appendChild(catTitle);
                
                const gallery = document.createElement('div');
                gallery.className = 'gallery';
                
                categoryProducts.forEach(product => {
                    const div = document.createElement('div');
                    div.className = 'product';
                    div.innerHTML = `
                        <div class="product-header">
                            <input type="checkbox" class="product-checkbox" value="${product.id}">
                            <img src="${product.image}" alt="Product ${product.number}" class="product-img">
                        </div>
                        <div class="product-info">
                            <div class="product-category">${getCategoryName(product.category)}</div>
                            <div class="product-number">Product ${product.number}</div>
                            <div class="quantity-selector">
                                <label>Qty:</label>
                                <input type="number" class="quantity-input" value="1" min="1" max="999">
                            </div>
                        </div>
                    `;
                    
                    const checkbox = div.querySelector('input[type="checkbox"]');
                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) {
                            div.classList.add('selected');
                        } else {
                            div.classList.remove('selected');
                        }
                    });
                    
                    gallery.appendChild(div);
                });
                
                container.appendChild(gallery);
            });
        }
        
        function filterCategory(cat) {
            currentCategory = cat;
            currentSearch = '';
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderGallery();
        }
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value.trim();
            renderGallery();
        });
        
        function selectAll() {
            document.querySelectorAll('.product-checkbox').forEach(cb => {
                cb.checked = true;
                cb.closest('.product').classList.add('selected');
            });
        }
        
        function deselectAll() {
            document.querySelectorAll('.product-checkbox').forEach(cb => {
                cb.checked = false;
                cb.closest('.product').classList.remove('selected');
            });
        }
        
        function generateList() {
            const selected = document.querySelectorAll('.product-checkbox:checked');
            if (selected.length === 0) {
                alert('Please select at least one product');
                return;
            }
            
            const items = Array.from(selected).map(cb => {
                const product = products.find(p => p.id == cb.value);
                const qty = cb.closest('.product').querySelector('.quantity-input').value;
                return `Product ${product.number} x ${qty}`;
            });
            
            const timestamp = new Date().toLocaleString();
            const listContent = `Generated on: ${timestamp}
Selected Products (${items.length}):

${items.join('\n')}`;
            
            document.getElementById('listText').textContent = listContent;
            document.getElementById('copySuccess').style.display = 'none';
            document.getElementById('listModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('listModal').classList.remove('show');
        }
        
        function copyToClipboard() {
            const text = document.getElementById('listText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const successMsg = document.getElementById('copySuccess');
                successMsg.style.display = 'block';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 2000);
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('listModal');
            if (event.target == modal) {
                closeModal();
            }
        }
        
        renderGallery();
    </script>
</body>
</html>
